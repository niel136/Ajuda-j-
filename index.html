    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --pj-navy: #0F172A;
        --pj-blue: #1E3A8A;
        --pj-slate: #F1F5F9;
      }
      /* CRITICAL: Fix for cut elements and lateral scroll */
      html, body {
        overflow-x: hidden;
        position: relative;
        width: 100%;
        max-width: 100vw;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-color: #F6F6F6; 
        -webkit-tap-highlight-color: transparent;
        height: 100dvh;
        color: #111111;
      }

      #root { 
        min-height: 100dvh; 
        display: flex; 
        flex-direction: column;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }

      * {
        box-sizing: border-box;
        max-width: 100%; /* Prevents elements from breaking layout */
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animate-float { animation: float 4s ease-in-out infinite; }
      
      .animate-app-in { 
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      @keyframes slideUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      input, select, textarea {
        font-size: 16px !important; 
        background-color: #FFFFFF !important;
        outline: none;
      }
      
      .btn-active:active { transform: scale(0.96); opacity: 0.9; }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.1);
        border-radius: 10px;
      }

      /* Transitions for Module switching */
      .module-fade-enter { opacity: 0; transform: scale(0.98); }
      .module-fade-enter-active { opacity: 1; transform: scale(1); transition: all 300ms ease-out; }
    </style>
